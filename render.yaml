services:
  - type: web
    name: aurastore-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: aurastore-db
          property: connectionString

databases:
  - name: aurastore-db
    databaseName: ecommerce_db
    user: ecommerce_user
    plan: free
